<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Projects</title>
  <link rel="stylesheet" href="projects.css" />
  <!-- Fontawesome CDN Link -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- AOS -->
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
</head>
<body>
    <!-- navgaition menu -->
    <nav>
        <div class="navbar">
            <div class="logo"><a href="../index.html">Anushkaa Ambuj.</a></div>
            <div class="media-icons">
                <a href="https://www.linkedin.com/in/anushkaa-ambuj" target="_blank"><i class="fab fa-linkedin-in"></i></a>
                <a href="https://github.com/anushkaa-ambuj" target="_blank"><i class="fab fa-github"></i></a>
                <a href="#"><i class="fab fa-facebook-f" target="_blank"></i></a>
                <a href="#"><i class="fab fa-twitter" target="_blank"></i></a>
                <a href="#"><i class="fab fa-instagram" target="_blank"></i></a>
            </div>
        </div>
    </nav>

    <section>
        <div class="content">
            <div class="title"><span>Projects</span></div>
            <div id="filter-search-container">
            <select id="domain-filter">
                <option value="All">All Domains</option>
            </select>
            <input 
                type="text" 
                id="search-bar" 
                placeholder="Search projects by title, tech stack, or domain..."
            />
            </div>
            <section id="project-cards"></section>
        </div>
    </section>
    <div id="project-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modal-title"></h2>
            <p id="modal-ps"></p>
            <p id="modal-dates"></p>
            <img id="modal-image" src="" alt="">
            <p id="modal-description"></p>
            <p><strong>Tech Stack:</strong> <span id="modal-tech-stack"></span></p>
            <div class="card-links">
            <a id="modal-demo-link" href="#" target="_blank">View Demo</a>
            <a id="modal-repo-link" href="#" target="_blank">View Repo</a>
            </div>
        </div>
    </div>

    <script src="projects.js"></script>
</body>
</html>
